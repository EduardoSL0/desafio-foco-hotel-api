name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    name: Testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, simplexml, zip
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Padrão de código (Pint)
        run: vendor/bin/pint --test

      - name: Testes (PHPUnit)
        run: php artisan test

      - name: Validar especificação OpenAPI
        run: npx --yes @redocly/cli@latest lint public/docs/openapi.yaml
