server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Redirecionamentos relativos: preserva a porta publicada (ex.: :8080) ao redirecionar /docs -> /docs/.
    absolute_redirect off;

    # Não informa a versão do Nginx nos cabeçalhos e páginas de erro.
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    charset utf-8;
    client_max_body_size 10M;

    # Erros gerados pelo próprio Nginx (antes de chegar ao Laravel) também respondem em JSON.
    # 400 (URL malformada) usa resposta estática: o Nginx não faz redirecionamento interno de uma requisição que ele próprio rejeitou.
    error_page 400 /__errors/400.json;
    error_page 414 /__errors/414.json;
    error_page 494 /__errors/494.json;
    error_page 403 = @json_403;
    error_page 413 = @json_413;
    error_page 502 503 504 = @json_503;

    location = /__errors/400.json { internal; default_type application/json; return 400 '{"message":"Requisição inválida."}'; }
    location = /__errors/414.json { internal; default_type application/json; return 414 '{"message":"Endereço (URL) muito longo."}'; }
    location = /__errors/494.json { internal; default_type application/json; return 400 '{"message":"Cabeçalhos da requisição muito grandes."}'; }
    location @json_403 { default_type application/json; return 403 '{"message":"Acesso negado."}'; }
    location @json_413 { default_type application/json; return 413 '{"message":"Requisição muito grande (máximo de 10 MB)."}'; }
    location @json_503 { default_type application/json; return 503 '{"message":"Serviço temporariamente indisponível. Tente novamente em instantes."}'; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Resolve "app" pelo DNS do Docker a cada 10 s: se o container app for recriado (novo IP), o Nginx acompanha.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
