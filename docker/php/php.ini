date.timezone = America/Bahia
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
expose_php = Off

; Desempenho: o código PHP compilado fica em memória (OPcache) e os caminhos de arquivos
; resolvidos ficam em cache. Faz muita diferença no Docker Desktop (Windows/macOS), onde
; ler arquivos da pasta compartilhada com o host é lento.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Em desenvolvimento, alterações no código são detectadas em até 2 segundos.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
