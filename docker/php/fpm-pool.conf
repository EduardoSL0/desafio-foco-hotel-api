; O padrão da imagem oficial é 5 processos: com 200 requisições simultâneas a fila
; fazia a latência passar de 10 s. Ajuste conforme a memória disponível (~30-40 MB por processo).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
