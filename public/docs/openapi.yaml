openapi: 3.0.0
info:
  title: Foco Hotel API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    API REST do desafio Foco Multimídia: gestão de quartos/acomodações e motor de reservas.

    **Autenticação:** faça `POST /auth/login` e envie o token retornado no cabeçalho
    `Authorization: Bearer <token>` nas rotas marcadas com o cadeado.

    **Perfis:**
    - `admin` — acesso total a todos os hotéis;
    - `manager` — gerencia quartos, cupons e reservas do próprio hotel;
    - `receptionist` — consulta reservas e registra pagamentos do próprio hotel.

    Usuários de teste (após o seed): `admin@foco.test`, `gerente@foco.test`, `recepcao@foco.test` — senha `password`.
security: []
servers:
  - url: /api/v1
    description: Servidor atual
tags:
  - name: Auth
    description: Login e tokens de acesso (Sanctum)
  - name: Hotéis
    description: Hotéis importados do XML
  - name: Quartos
    description: CRUD de quartos/acomodações e disponibilidade
  - name: Reservas
    description: "Motor de reservas: busca, cotação, criação e cancelamento"
  - name: Pagamentos
    description: Pagamentos das reservas (parcelamento e juros)
  - name: Cupons
    description: Cupons de desconto
  - name: Promoções
    description: Promoções por período, por hotel ou quarto
  - name: Usuários
    description: Equipe do hotel e perfis de acesso
  - name: Relatórios
    description: Indicadores de desempenho do hotel

paths:
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Gera um token de acesso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@foco.test }
                password: { type: string, example: password }
      responses:
        '200':
          description: Token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_type: { type: string, example: Bearer }
                  access_token: { type: string, example: 1|abc123... }
                  expires_in: { type: integer, example: 28800 }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: Revoga o token atual
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revogado }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /hotels:
    get:
      operationId: getHotels
      tags: [Hotéis]
      summary: Lista os hotéis
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Hotel' }

  /hotels/{hotel}:
    get:
      operationId: getHotelsHotel
      tags: [Hotéis]
      summary: Detalha um hotel
      parameters: [{ $ref: '#/components/parameters/HotelId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Hotel' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms:
    get:
      operationId: getRooms
      tags: [Quartos]
      summary: Lista quartos (paginado)
      parameters:
        - { name: hotel_id, in: query, schema: { type: integer }, description: Filtra por hotel }
        - { name: search, in: query, schema: { type: string }, description: Busca por nome }
        - { name: per_page, in: query, schema: { type: integer, default: 15, maximum: 100 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Room' }
                  links: { type: object }
                  meta: { type: object }
    post:
      operationId: postRooms
      tags: [Quartos]
      summary: Cadastra um quarto
      description: Permitido para `admin` ou `manager` do hotel informado.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomInput' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Room' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /rooms/{room}:
    parameters: [{ $ref: '#/components/parameters/RoomId' }]
    get:
      operationId: getRoomsRoom
      tags: [Quartos]
      summary: Detalha um quarto
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Room' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putRoomsRoom
      tags: [Quartos]
      summary: Atualiza um quarto (PUT/PATCH, campos parciais aceitos)
      description: '`hotel_id` não pode ser alterado.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomUpdate' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Room' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      operationId: patchRoomsRoom
      tags: [Quartos]
      summary: Atualiza parcialmente um quarto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomUpdate' }
      responses:
        '200': { description: Atualizado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteRoomsRoom
      tags: [Quartos]
      summary: Remove um quarto (soft delete)
      description: Bloqueado (409) se houver reservas futuras ativas.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{room}/availability:
    get:
      operationId: getRoomsRoomAvailability
      tags: [Quartos]
      summary: Unidades disponíveis do quarto no período
      parameters:
        - { $ref: '#/components/parameters/RoomId' }
        - { name: check_in, in: query, required: true, schema: { type: string, format: date }, example: "2027-03-10" }
        - { name: check_out, in: query, required: true, schema: { type: string, format: date }, example: "2027-03-13" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      room_id: { type: integer }
                      check_in: { type: string, format: date }
                      check_out: { type: string, format: date }
                      inventory: { type: integer, example: 10 }
                      available_units: { type: integer, example: 7 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reserves/lookup:
    post:
      operationId: postReservesLookup
      tags: [Reservas]
      summary: Minha reserva (consulta pelo hóspede)
      description: |
        O hóspede consulta a própria reserva com o **localizador** (enviado na criação e no e-mail de
        confirmação) e o **sobrenome** de um dos hóspedes. Os dados vão no corpo, não na URL, para não
        ficarem em logs de servidores. Código inexistente e sobrenome errado retornam o mesmo 404.
        Limite de 10 tentativas por minuto.

        A resposta é a **visão pública**: nomes dos hóspedes, datas, valores e saldo, sem telefone,
        e-mail nem lista de pagamentos (quem tem o localizador não é necessariamente titular de todos os dados).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, last_name]
              properties:
                code: { type: string, minLength: 8, maxLength: 8, example: FH7K3Q9X, description: "FH7K3Q9X é a reserva 1 do XML (dados de demonstração)" }
                last_name: { type: string, example: de Tal }
      responses:
        "200":
          description: Reserva encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PublicReserve" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /reserves/quote:
    post:
      operationId: postReservesQuote
      tags: [Reservas]
      summary: Cotação da estadia (não cria reserva)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses:
        '200':
          description: Cotação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Quote' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reserves:
    get:
      operationId: getReserves
      tags: [Reservas]
      summary: Lista reservas (admin vê todas; demais, apenas do próprio hotel)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: hotel_id, in: query, schema: { type: integer } }
        - { name: room_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReserveStatus' } }
        - { name: per_page, in: query, schema: { type: integer, default: 15 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Reserve' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: postReserves
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Opcional. Chave única por tentativa: reenviar a **mesma chave com o mesmo corpo** devolve a resposta original
            (cabeçalho `Idempotent-Replayed: true`) sem duplicar; a mesma chave com outro corpo retorna 422.
            Vale por 24 h. Para testar, informe uma chave nova (ex.: `teste-001`) e execute duas vezes.
          schema: { type: string, minLength: 8, maxLength: 100 }
      tags: [Reservas]
      summary: Cria uma reserva
      description: |
        Rota pública (motor de reservas). Fluxo:
        1. valida período, hóspedes e capacidade do quarto;
        2. verifica disponibilidade considerando o inventário do quarto (409 se esgotado);
        3. calcula diárias aplicando **promoções → cupom → taxa de serviço**;
        4. registra hóspedes, diárias e pagamentos iniciais em uma única transação
           (pagamentos junto com a reserva apenas pela equipe autenticada do hotel);
        5. gera o localizador (`code`) e envia e-mail de confirmação ao hóspede, se houver e-mail.

        **Pré-reserva:** sem login da equipe do hotel, a reserva nasce `pending` com prazo
        (`expires_at`, padrão 24 h, `RESERVE_PENDING_TTL_HOURS`). Sem pagamento até lá, ela deixa de ocupar
        o quarto e é cancelada pelo agendador. Registrar um pagamento garante a reserva.

        **Resposta:** a equipe do hotel recebe a reserva completa (`Reserve`); o público recebe a visão
        pública (`PublicReserve`), que não devolve contatos de hóspedes já cadastrados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveInput' }
            example:
              room_id: 1
              check_in: "2027-03-10"
              check_out: "2027-03-13"
              coupon_code: BEMVINDO10
              guests:
                - { name: Maria, last_name: Souza, phone: "5571999990000", email: maria@example.com }
      responses:
        '201':
          description: Reserva criada (completa para a equipe do hotel; visão pública para os demais)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - { $ref: '#/components/schemas/Reserve' }
                      - { $ref: '#/components/schemas/PublicReserve' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /reserves/{reserve}:
    get:
      operationId: getReservesReserve
      tags: [Reservas]
      summary: Detalha uma reserva
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ReserveId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Reserve' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reserves/{reserve}/cancel:
    patch:
      operationId: patchReservesReserveCancel
      tags: [Reservas]
      summary: Cancela uma reserva (admin/manager)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ReserveId' }]
      responses:
        '200': { description: Reserva cancelada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reserves/{reserve}/payments:
    parameters: [{ $ref: '#/components/parameters/ReserveId' }]
    get:
      operationId: getReservesReservePayments
      tags: [Pagamentos]
      summary: Lista pagamentos da reserva
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
    post:
      operationId: postReservesReservePayments
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Opcional. Chave única por tentativa: reenviar a **mesma chave com o mesmo corpo** devolve a resposta original
            (cabeçalho `Idempotent-Replayed: true`) sem duplicar; a mesma chave com outro corpo retorna 422.
            Vale por 24 h. Para testar, informe uma chave nova (ex.: `teste-001`) e execute duas vezes.
          schema: { type: string, minLength: 8, maxLength: 100 }
      tags: [Pagamentos]
      summary: Registra um pagamento
      description: |
        Parcelamento apenas no cartão de crédito (method=1). Acima de 3 parcelas incide juros simples
        de 1,99% por parcela excedente (configurável).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Pagamento registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Payment' }
                  reserve:
                    type: object
                    properties:
                      status: { $ref: '#/components/schemas/ReserveStatus' }
                      balance: { type: number, example: 200.0 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reserves/{reserve}/payments/{payment}/refund:
    post:
      operationId: postReservesReservePaymentsPaymentRefund
      tags: [Pagamentos]
      summary: Estorna um pagamento (admin/manager)
      description: |
        Estorno integral: o pagamento deixa de abater o saldo, e o status da reserva é recalculado
        (uma reserva cancelada continua cancelada). Também é o caminho para devolver o dinheiro de uma
        reserva cancelada. Pagamentos importados do XML são estornados no sistema de origem (422).
        Aceita `Idempotency-Key`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ReserveId' }
        - { name: payment, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pagamento estornado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Payment' }
                  reserve:
                    type: object
                    properties:
                      status: { $ref: '#/components/schemas/ReserveStatus' }
                      balance: { type: number, example: 300.0 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /coupons:
    get:
      operationId: getCoupons
      tags: [Cupons]
      summary: Lista cupons
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Coupon' }
    post:
      operationId: postCoupons
      tags: [Cupons]
      summary: Cria um cupom (global apenas para admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponInput' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Coupon' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /coupons/{coupon}:
    delete:
      operationId: deleteCouponsCoupon
      tags: [Cupons]
      summary: Remove um cupom
      description: Cupom já usado em reservas é apenas desativado (preserva o histórico das reservas).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coupon, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Removido }
        '403': { $ref: '#/components/responses/Forbidden' }

  /availability:
    get:
      operationId: getAvailability
      tags: [Reservas]
      summary: Busca quartos disponíveis com preço calculado
      description: |
        Retorna os quartos com unidades livres no período, que comportam o número de hóspedes e
        possuem tarifa, com o total já calculado (promoções, cupom e taxas), ordenados pelo menor preço.
        Um cupom inválido para um hotel é ignorado naquele resultado.
      parameters:
        - { name: check_in, in: query, required: true, schema: { type: string, format: date }, example: "2027-03-10" }
        - { name: check_out, in: query, required: true, schema: { type: string, format: date }, example: "2027-03-13" }
        - { name: guests, in: query, schema: { type: integer, default: 1 }, example: 2 }
        - { name: hotel_id, in: query, schema: { type: integer } }
        - { name: coupon_code, in: query, schema: { type: string }, example: BEMVINDO10 }
        - { name: per_page, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
      responses:
        "200":
          description: Resultados da busca
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  meta:
                    type: object
                    properties:
                      check_in: { type: string, format: date }
                      check_out: { type: string, format: date }
                      guests: { type: integer }
                      results: { type: integer, description: Total de quartos encontrados (todas as páginas) }
                      current_page: { type: integer }
                      per_page: { type: integer }
                      last_page: { type: integer }
        "422": { $ref: "#/components/responses/ValidationError" }

  /hotels/{hotel}/report:
    get:
      operationId: getHotelsHotelReport
      tags: [Relatórios]
      summary: Indicadores do hotel (ocupação, ADR, RevPAR, recebimentos)
      description: |
        Apenas admin ou gerente do hotel. Período padrão: mês atual.
        - **Ocupação** = room-nights vendidas / room-nights disponíveis
        - **ADR** (diária média) = receita de hospedagem / room-nights vendidas
        - **RevPAR** = receita de hospedagem / room-nights disponíveis
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/HotelId" }
        - { name: from, in: query, schema: { type: string, format: date }, example: "2022-12-01", description: "Padrão: início do mês de `to` (ou do mês atual). Dez/2022 tem os dados do XML." }
        - { name: to, in: query, schema: { type: string, format: date }, example: "2022-12-31", description: "Padrão: fim do mês de `from` (ou do mês atual). Não pode ser anterior a `from`." }
      responses:
        "200":
          description: Relatório
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HotelReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /promotions:
    get:
      operationId: getPromotions
      tags: [Promoções]
      summary: Lista promoções (admin vê todas; demais, do próprio hotel)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: hotel_id, in: query, schema: { type: integer } }
        - { name: only_active, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Promotion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: postPromotions
      tags: [Promoções]
      summary: Cria uma promoção (admin ou gerente do hotel)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Promotion" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /promotions/{promotion}:
    parameters:
      - { name: promotion, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getPromotionsPromotion
      tags: [Promoções]
      summary: Detalha uma promoção
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putPromotionsPromotion
      tags: [Promoções]
      summary: Atualiza uma promoção (mesmas regras do PATCH)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionUpdate" }
      responses:
        "200": { description: Atualizada }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      operationId: patchPromotionsPromotion
      tags: [Promoções]
      summary: Atualiza uma promoção (campos parciais; hotel_id não pode mudar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionUpdate" }
      responses:
        "200": { description: Atualizada }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deletePromotionsPromotion
      tags: [Promoções]
      summary: Remove uma promoção
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removida }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users:
    get:
      operationId: getUsers
      tags: [Usuários]
      summary: Lista a equipe (admin vê todos; gerente, o próprio hotel)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: hotel_id, in: query, schema: { type: integer } }
        - { name: role, in: query, schema: { type: string, enum: [admin, manager, receptionist] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: postUsers
      tags: [Usuários]
      summary: Cadastra um usuário
      description: |
        Admin cadastra qualquer perfil. Gerente cadastra apenas recepcionistas do próprio hotel
        (hotel_id pode ser omitido); criar gerentes e administradores é exclusivo do admin.
        Senha mínima de 8 caracteres com letras e números. O e-mail é gravado em minúsculas.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getUsersUser
      tags: [Usuários]
      summary: Detalha um usuário (o próprio ou da equipe do hotel)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putUsersUser
      tags: [Usuários]
      summary: Atualiza um usuário (mesmas regras do PATCH)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200": { description: Atualizado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      operationId: patchUsersUser
      tags: [Usuários]
      summary: Atualiza um usuário (troca de senha revoga os tokens ativos)
      description: |
        Gerente altera os recepcionistas do próprio hotel e o próprio cadastro (sem mudar o perfil).
        Para trocar a **própria** senha é obrigatório informar `current_password`.
        O único administrador do sistema não pode ser rebaixado nem excluído.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200": { description: Atualizado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteUsersUser
      tags: [Usuários]
      summary: Remove um usuário (não é possível remover a si mesmo)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removido }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    HotelId: { name: hotel, in: path, required: true, schema: { type: integer }, example: 1 }
    RoomId: { name: room, in: path, required: true, schema: { type: integer }, example: 1 }
    ReserveId: { name: reserve, in: path, required: true, schema: { type: integer }, example: 1 }

  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Forbidden:
      description: Sem permissão
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Conflict:
      description: 'Conflito de regra de negócio (ex.: sem disponibilidade)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    TooManyRequests:
      description: Limite de requisições excedido
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    Promotion:
      type: object
      properties:
        id: { type: integer }
        hotel_id: { type: integer }
        room_id: { type: integer, nullable: true, description: Nulo = todos os quartos do hotel }
        name: { type: string, example: Baixa temporada }
        discount_percent: { type: number, example: 15.0 }
        starts_at: { type: string, format: date }
        ends_at: { type: string, format: date }
        active: { type: boolean }

    PromotionInput:
      type: object
      required: [hotel_id, name, discount_percent, starts_at, ends_at]
      properties:
        hotel_id: { type: integer, example: 1 }
        room_id: { type: integer, nullable: true, example: null, description: "Opcional: só um quarto do hotel. Vazio = hotel inteiro" }
        name: { type: string, example: Feriado }
        discount_percent: { type: number, minimum: 0.01, maximum: 100, example: 20 }
        starts_at: { type: string, format: date, example: "2027-03-20" }
        ends_at: { type: string, format: date, example: "2027-03-31" }
        active: { type: boolean, default: true, example: true }

    PromotionUpdate:
      type: object
      description: Campos parciais. O hotel_id pode ser reenviado, mas não trocado.
      properties:
        name: { type: string, example: Feriado prolongado }
        discount_percent: { type: number, minimum: 0.01, maximum: 100, example: 25 }
        starts_at: { type: string, format: date, example: "2027-03-20" }
        ends_at: { type: string, format: date, example: "2027-03-31" }
        active: { type: boolean, example: true }

    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, example: Ana Recepção }
        email: { type: string, format: email, example: ana@foco.test }
        password: { type: string, format: password, minLength: 8, example: senhaForte123 }
        role: { type: string, enum: [admin, manager, receptionist], example: receptionist }
        hotel_id: { type: integer, nullable: true, example: 1, description: "Obrigatório para manager/receptionist; proibido para admin" }

    UserUpdate:
      type: object
      description: Campos parciais. Trocar a senha revoga os tokens ativos do usuário.
      properties:
        name: { type: string, example: Ana Souza }
        email: { type: string, format: email, example: ana.souza@foco.test }
        password: { type: string, format: password, minLength: 8, example: novaSenha456 }
        current_password: { type: string, format: password, description: "Obrigatória ao trocar a própria senha" }
        role: { type: string, enum: [admin, manager, receptionist], example: receptionist }
        hotel_id: { type: integer, nullable: true, example: 1, description: "Obrigatório para manager/receptionist; proibido para admin" }

    SearchResult:
      type: object
      properties:
        room:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            capacity: { type: integer }
            daily_price: { type: number }
        hotel:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        available_units: { type: integer }
        coupon_applied: { type: string, nullable: true }
        price:
          type: object
          properties:
            nights: { type: integer }
            subtotal: { type: number }
            discount: { type: number }
            fees: { type: number }
            total: { type: number }
            average_daily: { type: number }
            adjustments: { type: array, items: { type: object } }

    HotelReport:
      type: object
      properties:
        hotel: { type: object }
        period:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            days: { type: integer }
        occupancy:
          type: object
          properties:
            inventory_units: { type: integer }
            available_room_nights: { type: integer }
            occupied_room_nights: { type: integer }
            rate_percent: { type: number, example: 8.06 }
        revenue:
          type: object
          properties:
            room_revenue: { type: number, example: 800.0 }
            adr: { type: number, example: 160.0 }
            revpar: { type: number, example: 12.9 }
        reserves:
          type: object
          properties:
            by_status: { type: object, additionalProperties: { type: integer } }
            booked_amount: { type: number, description: Total vendido (reservas ativas) }
            paid_amount: { type: number, description: "Recebido e não estornado (inclui reservas canceladas ainda não reembolsadas)" }
            refunded_amount: { type: number, description: Total estornado }
            outstanding_amount: { type: number, description: Saldo a receber das reservas ativas }
        top_rooms:
          type: array
          items:
            type: object
            properties:
              room_id: { type: integer }
              name: { type: string }
              nights: { type: integer }

    Message:
      type: object
      properties:
        message: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, manager, receptionist] }
        hotel_id: { type: integer, nullable: true }

    Hotel:
      type: object
      properties:
        id: { type: integer, example: 1 }
        external_code: { type: string, nullable: true, example: '1' }
        name: { type: string, example: Hotel Foco Prime }
        service_fee_percent: { type: number, example: 0 }
        rooms_count: { type: integer, example: 2 }

    Room:
      type: object
      properties:
        id: { type: integer, example: 1 }
        hotel_id: { type: integer, example: 1 }
        hotel: { $ref: '#/components/schemas/Hotel' }
        external_code: { type: string, nullable: true }
        name: { type: string, example: Room 1 Hotel 1 }
        description: { type: string, nullable: true }
        capacity: { type: integer, example: 2 }
        inventory: { type: integer, example: 10, description: Unidades disponíveis desta acomodação }
        daily_price: { type: number, nullable: true, example: 100.0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoomInput:
      type: object
      required: [hotel_id, name]
      properties:
        hotel_id: { type: integer, example: 1 }
        name: { type: string, maxLength: 120, example: Standard Casal }
        description: { type: string, example: 'Cama de casal, ar-condicionado e varanda' }
        capacity: { type: integer, minimum: 1, maximum: 20, default: 2 }
        inventory: { type: integer, minimum: 1, maximum: 1000, default: 1, example: 10 }
        daily_price: { type: number, minimum: 0, example: 189.9 }

    RoomUpdate:
      type: object
      description: Campos parciais no PATCH; no PUT, envie o quarto completo. O hotel_id pode ser reenviado, mas não trocado.
      properties:
        name: { type: string, example: Standard Casal }
        description: { type: string, nullable: true, example: "Cama de casal, ar-condicionado e varanda" }
        capacity: { type: integer, minimum: 1, maximum: 20, example: 2 }
        inventory: { type: integer, minimum: 1, maximum: 1000, example: 10 }
        daily_price: { type: number, nullable: true, example: 210 }

    GuestInput:
      type: object
      required: [name, last_name, phone]
      properties:
        name: { type: string, example: Maria }
        last_name: { type: string, example: Souza }
        phone: { type: string, pattern: '^\+?\d{10,15}$', example: '5571999990000' }
        email: { type: string, format: email, nullable: true }

    PaymentInput:
      type: object
      required: [method, value]
      properties:
        method:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 crédito, 2 débito, 3 pix, 4 dinheiro, 5 boleto
          example: 1
        value: { type: number, example: 100.0 }
        installments: { type: integer, minimum: 1, maximum: 12, default: 1 }

    QuoteInput:
      type: object
      required: [room_id, check_in, check_out]
      properties:
        hotel_id: { type: integer, example: 1, description: "Opcional (como o hotelCode do XML); se enviado, o quarto precisa ser deste hotel" }
        room_id: { type: integer, example: 1 }
        check_in: { type: string, format: date, example: '2027-03-10' }
        check_out: { type: string, format: date, example: '2027-03-13' }
        coupon_code: { type: string, example: BEMVINDO10 }

    ReserveInput:
      allOf:
        - $ref: '#/components/schemas/QuoteInput'
        - type: object
          required: [guests]
          properties:
            guests:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/GuestInput' }
            payments:
              type: array
              description: Somente a equipe autenticada do hotel pode enviar pagamentos junto com a reserva.
              items: { $ref: '#/components/schemas/PaymentInput' }

    Quote:
      type: object
      properties:
        room_id: { type: integer }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        nights: { type: integer, example: 3 }
        coupon_code: { type: string, nullable: true }
        dailies:
          type: array
          items: { $ref: '#/components/schemas/Daily' }
        adjustments:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [discount, fee] }
              label: { type: string, example: 'Cupom: BEMVINDO10' }
              amount: { type: number, example: 30.0 }
        subtotal: { type: number, example: 300.0 }
        discount: { type: number, example: 30.0 }
        fees: { type: number, example: 0 }
        total: { type: number, example: 270.0 }
        available_units: { type: integer, example: 1 }

    Daily:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number, example: 100.0 }
        discount: { type: number, example: 0 }

    ReserveStatus:
      type: string
      enum: [pending, partially_paid, paid, cancelled]

    Reserve:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: FH7K3Q9X, description: Localizador informado ao hóspede }
        external_code: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ReserveStatus' }
        source: { type: string, enum: [api, xml] }
        expires_at: { type: string, format: date-time, nullable: true, description: "Pré-reserva sem pagamento: deixa de ocupar o quarto após esta data" }
        hotel: { $ref: '#/components/schemas/Hotel' }
        room: { $ref: '#/components/schemas/Room' }
        coupon_code: { type: string, nullable: true }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        nights: { type: integer }
        amounts:
          type: object
          properties:
            subtotal: { type: number }
            discount: { type: number }
            fees: { type: number }
            total: { type: number }
            paid: { type: number }
            balance: { type: number }
        guests:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  id: { type: integer }
              - $ref: '#/components/schemas/GuestInput'
        dailies:
          type: array
          items: { $ref: '#/components/schemas/Daily' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        created_at: { type: string, format: date-time }

    PublicReserve:
      type: object
      description: Visão do hóspede (rotas públicas), sem contatos dos hóspedes nem lista de pagamentos.
      properties:
        id: { type: integer }
        code: { type: string, example: FH7K3Q9X }
        status: { $ref: '#/components/schemas/ReserveStatus' }
        expires_at: { type: string, format: date-time, nullable: true }
        hotel:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        room:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        coupon_code: { type: string, nullable: true }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        nights: { type: integer }
        amounts:
          type: object
          properties:
            subtotal: { type: number }
            discount: { type: number }
            fees: { type: number }
            total: { type: number }
            paid: { type: number }
            balance: { type: number }
        guests:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              last_name: { type: string }
        dailies:
          type: array
          items: { $ref: '#/components/schemas/Daily' }
        created_at: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id: { type: integer }
        reserve_id: { type: integer }
        method: { type: integer, example: 1 }
        method_label: { type: string, example: Cartão de crédito }
        value: { type: number, example: 100.0 }
        installments: { type: integer, example: 6 }
        interest: { type: number, example: 5.97 }
        source: { type: string, enum: [api, xml] }
        paid_at: { type: string, format: date-time, nullable: true }
        refunded_at: { type: string, format: date-time, nullable: true, description: Preenchido quando o pagamento foi estornado }

    Coupon:
      type: object
      properties:
        id: { type: integer }
        hotel_id: { type: integer, nullable: true }
        code: { type: string, example: BEMVINDO10 }
        type: { type: string, enum: [percent, fixed] }
        value: { type: number, example: 10 }
        valid_from: { type: string, format: date, nullable: true }
        valid_until: { type: string, format: date, nullable: true }
        max_uses: { type: integer, nullable: true }
        used_count: { type: integer }
        active: { type: boolean }

    CouponInput:
      type: object
      required: [code, type, value]
      properties:
        hotel_id: { type: integer, nullable: true, example: 1, description: Nulo = cupom global (somente admin) }
        code: { type: string, example: VERAO2030 }
        type: { type: string, enum: [percent, fixed], example: percent }
        value: { type: number, example: 15 }
        valid_from: { type: string, format: date, example: "2027-03-10" }
        valid_until: { type: string, format: date, example: "2027-03-31" }
        max_uses: { type: integer, minimum: 1, maximum: 1000000, nullable: true, example: 100, description: Vazio = ilimitado }
        active: { type: boolean, default: true }
