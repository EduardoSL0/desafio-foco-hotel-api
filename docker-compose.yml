# Variáveis comuns: têm prioridade sobre o .env, garantindo o MySQL do compose.
# Senhas: os padrões abaixo servem só para avaliação local; em outro ambiente defina
# DB_PASSWORD e MYSQL_ROOT_PASSWORD (ex.: num arquivo .env ao lado deste compose).
x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: foco_hotel
  DB_USERNAME: foco
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_DEBUG: ${APP_DEBUG:-false}
  CACHE_STORE: database
  LOG_FILE_PERMISSION: "0666"
  # Limites de requisição por minuto (padrões da aplicação; podem ser ajustados por ambiente).
  RATE_LIMIT_BOOKING: ${RATE_LIMIT_BOOKING:-30}
  RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-120}
  RATE_LIMIT_STAFF: ${RATE_LIMIT_STAFF:-240}
  RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
  RATE_LIMIT_LOGIN_PER_EMAIL: ${RATE_LIMIT_LOGIN_PER_EMAIL:-5}
  RATE_LIMIT_LOOKUP: ${RATE_LIMIT_LOOKUP:-10}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: foco-app
    restart: unless-stopped
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
      # Dados e usuários de demonstração (senha "password"): só para avaliação.
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - ./:/var/www/html
      # vendor/ em volume do Docker (fora da pasta compartilhada): muito mais rápido no Docker Desktop.
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  # Executa o scheduler do Laravel (equivalente ao CRON "* * * * * php artisan schedule:run").
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: foco-scheduler
    restart: unless-stopped
    # Mesmo usuário do PHP-FPM: arquivos criados pelo cron continuam graváveis pela API.
    user: www-data
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      # vendor/ em volume do Docker (fora da pasta compartilhada): muito mais rápido no Docker Desktop.
      - vendor:/var/www/html/vendor
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: foco-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    # /up responde 200 só com o PHP e o banco funcionando.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:8.0
    container_name: foco-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foco_hotel
      MYSQL_USER: foco
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # Publicado só para esta máquina (ferramentas como o MySQL Workbench); não fica exposto na rede.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  vendor:
